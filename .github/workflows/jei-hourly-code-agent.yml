name: JEI Hourly Code Agent (opt-in, PR only)
# Real code-editing requires separately authorized model inference; the default
# state does NOT use an API key, incur AI cost, or modify production.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: jei-hourly-code-agent
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
    steps:
      - name: Check explicit opt-in and outstanding agent PR
        id: gate
        env:
          AUTOCODE_ENABLED: ${{ vars.JEI_CODING_AGENT_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUTOCODE_ENABLED" != "true" ]; then
            echo "AGENT_BLOCKED: set JEI_CODING_AGENT_ENABLED=true only after authorizing API usage" >> "$GITHUB_STEP_SUMMARY"
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open_count=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("jei/autofix-"))] | length')
          if [ "$open_count" -gt 0 ]; then
            echo "AGENT_PAUSED: an automated fix PR is already open; no duplicate proposal" >> "$GITHUB_STEP_SUMMARY"
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"

  propose:
    needs: guard
    if: needs.guard.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      patch_ready: ${{ steps.patch.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Propose one minimal tested repair using Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/jei/hourly-coding-task.md
          permission-profile: ':workspace'
      - name: Capture source-only patch without credentials
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- scripts tests remote tools
          git diff --binary HEAD -- scripts tests remote tools > "$RUNNER_TEMP/jei-proposal.patch"
          if [ -s "$RUNNER_TEMP/jei-proposal.patch" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'NO_SAFE_PATCH: no code changes produced this run' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.ready == 'true'
        with:
          name: jei-autocode-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/jei-proposal.patch
          retention-days: 7
          if-no-files-found: error

  validate:
    needs: propose
    if: needs.propose.outputs.patch_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: jei-autocode-patch-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Reject unsafe paths, binary patches, deletion and invalid diffs
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/jei-proposal.patch"
          test -s "$patch"
          if git apply --numstat "$patch" | awk -F '\t' '$1 == "-" || $2 == "-" { bad=1 } END { exit !bad }'; then
            echo 'Binary patches are disallowed' >&2
            exit 1
          fi
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          test -n "$(git diff --name-only)"
          while IFS= read -r file; do
            case "$file" in
              scripts/*.py|tools/*.py|tests/*.py|tests/*.cjs|remote/*.js|remote/*.html) ;;
              *) echo "Unsafe generated file: $file" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          if [ -n "$(git diff --name-only --diff-filter=D)" ]; then
            echo 'File deletion is not permitted' >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual JEI safety regressions before PR
        run: |
          python -m unittest discover -s tests -p 'test_brief_dispatch_policy.py' -v
          python -m unittest discover -s tests -p 'test_market_feed_watchdog.py' -v
          python -m unittest discover -s tests -p 'test_early_index_crash_alert.py' -v
          node tests/dashboard_smoke.test.cjs
          node tests/research_engine.test.cjs

  open_pr:
    needs: [propose, validate]
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: jei-autocode-patch-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Propose validated change without unattended merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="jei/autofix-$GITHUB_RUN_ID"
          git apply --check "$RUNNER_TEMP/jei-proposal.patch"
          git switch -c "$branch"
          git apply "$RUNNER_TEMP/jei-proposal.patch"
          git add -- scripts tests remote tools
          git config user.name 'JEI Autonomous Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "fix: hourly agent proposal $GITHUB_RUN_ID"
          git push -u origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "JEI hourly coding agent: validated repair ($GITHUB_RUN_ID)" \
            --body "Automated proposed fix from GitHub run $GITHUB_RUN_ID. Source-only patch was validated in a separate read-only job; this PR requires full normal CI and review before merge. No live LINE send, private token, real order, or unattended merge authorized."
