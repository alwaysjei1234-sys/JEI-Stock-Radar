name: JEI Verified TAIEX Early Crash Siren

# Independent single-index check can warn sooner than a 1,973-stock scan.
# GitHub schedule is best-effort; the main market update runs this too.
on:
  schedule:
    - cron: '2-57/5 1-5 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_line_status.py'
      - 'tests/test_line_status.py'
      - 'scripts/early_index_crash_alert.py'
      - '.github/workflows/jei-early-index-crash.yml'
  pull_request:
    paths:
      - 'scripts/publish_line_status.py'
      - 'tests/test_line_status.py'
      - 'scripts/early_index_crash_alert.py'
      - 'tests/test_early_index_crash_alert.py'
      - '.github/workflows/jei-early-index-crash.yml'

permissions:
  contents: read

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject fake stale or wrong-identity index alerts
        run: |
          python -m unittest discover -s tests -p 'test_early_index_crash_alert.py' -v
          python -m unittest discover -s tests -p 'test_line_status.py' -v

  notify:
    permissions:
      contents: write
    concurrency:
      group: jei-early-index-receipt
      cancel-in-progress: false
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify TAIEX execution-price and anti-lookahead guard
        run: |
          python -m unittest discover -s tests -p 'test_mis_index_identity.py' -v
          python -m unittest discover -s tests -p 'test_early_index_crash_alert.py' -v
      - name: Independent verified index-only red/crash signal
        env:
          JEI_LINE_ENABLED: ${{ vars.JEI_LINE_ENABLED }}
          JEI_LINE_ALERTS_ENABLED: ${{ vars.JEI_LINE_ENABLED == 'true' && vars.JEI_LINE_ALERTS_ENABLED != 'false' }}
          JEI_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.JEI_LINE_CHANNEL_ACCESS_TOKEN }}
          JEI_LINE_USER_ID: ${{ secrets.JEI_LINE_USER_ID }}
        run: python -m scripts.early_index_crash_alert --result-path "${{ runner.temp }}/jei-early-index-alert-result.json"
      - name: Preserve allowlisted index siren/LINE receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jei-early-index-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jei-early-index-alert-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish public intraday LINE decision without recipient or credentials
        if: always() && github.event_name != 'pull_request'
        env:
          LINE_RECEIPT_PATH: ${{ runner.temp }}/jei-early-index-alert-result.json
          LINE_RUN_ID: ${{ github.run_id }}
        run: |
          if [ ! -f "$LINE_RECEIPT_PATH" ]; then exit 0; fi
          python scripts/publish_line_status.py --receipt "$LINE_RECEIPT_PATH" --run-id "$LINE_RUN_ID"
          for i in 1 2 3; do
            if git diff --quiet -- remote/line_status.json && git ls-files --error-unmatch remote/line_status.json >/dev/null 2>&1; then exit 0; fi
            git config user.name 'JEI LINE Status Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add remote/line_status.json
            git commit -m 'Auto-update public LINE dispatch status'
            if git push origin HEAD:main; then exit 0; fi
            if [ "$i" = 3 ]; then break; fi
            # Receipt lives outside checkout; merge it into the latest main
            # after a race, preserving newer records and all unrelated files.
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_line_status.py --receipt "$LINE_RECEIPT_PATH" --run-id "$LINE_RUN_ID"
          done
          echo 'LINE status could not be published; API artifact remains available'
          exit 1
