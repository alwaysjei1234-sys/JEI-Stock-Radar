name: Backfill TPEx History

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/backfill_tpex_history.py'
      - '.github/workflows/backfill-tpex-history.yml'

permissions:
  contents: write

concurrency:
  group: jei-tpex-history
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backfill TPEx history
        run: python scripts/backfill_tpex_history.py
      - name: Publish history
        run: |
          if git diff --quiet -- remote/history.json; then
            echo "No history change"
            exit 0
          fi
          git config user.name "JEI History Bot"
          git config user.email "actions@users.noreply.github.com"
          git add remote/history.json
          git commit -m "Backfill TPEx historical closes"
          git pull --rebase origin main
          git push
