name: JEI Compute Provenance Audit (GitHub Actions)
on:
  push:
    branches:
      - main
      - feature/actions-colab-audit-20261107
      - fix/hourly-colab-audit-20261113
      - fix/pick-quality-audit-20261113
      - fix/compute-provenance-20261113
      - feat/colab-verifiable-bridge-20261113
      - fix/colab-output-integrity-20261113
      - fix/colab-audit-schedule-reliability-20261113
      - feat/shared-colab-actions-compute-20261113
      - feat/colab-stall-watchdog-20261113
      - feat/colab-heartbeat-emitter-20261113
    # Publishing status from the same workflow must not create a feedback loop.
    paths-ignore:
      - 'remote/colab_coordination.json'
  pull_request:
    paths:
      - 'tools/jei_actions_audit.py'
      - 'scripts/public_holding_signals.py'
      - 'tools/jei_audit_manifest.py'
      - 'tests/test_jei_audit_manifest.py'
      - 'tests/test_jei_actions_audit.py'
      - 'tools/jei_performance_quality.py'
      - 'tests/test_jei_performance_quality.py'
      - 'tools/jei_compute_provenance.py'
      - 'tests/test_jei_compute_provenance.py'
      - 'tools/jei_colab_report_validator.py'
      - 'tests/test_jei_colab_report_validator.py'
      - 'colab/JEI_Colab_Audit.ipynb'
      - 'tests/test_jei_colab_notebook.py'
      - 'tools/jei_shared_compute.py'
      - 'tests/test_jei_shared_compute.py'
      - 'tools/jei_colab_watchdog.py'
      - 'tests/test_jei_colab_watchdog.py'
      - 'tools/jei_colab_heartbeat.py'
      - 'tests/test_jei_colab_heartbeat.py'
      - 'tools/jei_colab_coordination.py'
      - 'tests/test_jei_colab_coordination.py'
      - 'tests/test_jei_colab_10_roundtrips.py'
      - 'tests/test_jei_colab_versioned_bridge.py'
      - 'tools/jei_drive_heartbeat_ingest.py'
      - 'tests/test_jei_drive_heartbeat_ingest.py'
      - 'tools/jei_batch_checkpoint.py'
      - 'tests/test_jei_batch_checkpoint.py'
      - 'tools/jei_resumable_observed.py'
      - 'tests/test_jei_resumable_observed.py'
      - '.github/workflows/jei-colab-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify audit logic
        run: python -m unittest discover -s tests -p 'test_jei_actions_audit.py' -v
      - name: Verify pick quality classifications
        run: python -m unittest discover -s tests -p 'test_jei_performance_quality.py' -v
      - name: Audit checked-out public feed
        id: feed_audit
        continue-on-error: true
        run: python -m tools.jei_actions_audit --feed remote/system.json --out audit-output --commit "$GITHUB_SHA"
      - name: Record observed pick quality (not independent OOS)
        run: python -m tools.jei_performance_quality --input remote/pick_validation.json --out audit-output/pick_quality.json
      - name: Verify compute provenance tests
        run: python -m unittest discover -s tests -p 'test_jei_compute_provenance.py' -v
      - name: Record GitHub compute provenance (Colab unverified)
        run: python -m tools.jei_compute_provenance --quality audit-output/pick_quality.json --out audit-output/compute_provenance.json
      - name: Verify Colab report validation logic
        run: python -m unittest discover -s tests -p 'test_jei_colab_report_validator.py' -v
      - name: Validate notebook structure
        run: python -m json.tool colab/JEI_Colab_Audit.ipynb > /dev/null
      - name: Verify notebook source and report round trip
        run: python -m unittest discover -s tests -p 'test_jei_colab_notebook.py' -v
      - name: Verify portable computation
        run: python -m unittest discover -s tests -p 'test_jei_shared_compute.py' -v
      - name: Execute portable observed-performance computation
        run: python -m tools.jei_shared_compute --provider github_actions --source-commit "$GITHUB_SHA" --output-dir audit-output
      - name: Verify Colab stall watchdog
        run: python -m unittest discover -s tests -p 'test_jei_colab_watchdog.py' -v
      - name: Assess accessible Colab heartbeat (UNKNOWN when unavailable)
        run: python -m tools.jei_colab_watchdog --output audit-output/colab_watchdog.json
      - name: Verify live Colab heartbeat producer
        run: python -m unittest discover -s tests -p 'test_jei_colab_heartbeat.py' -v
      - name: Verify resumable checkpoints
        run: python -m unittest discover -s tests -p 'test_jei_batch_checkpoint.py' -v
      - name: Verify credential-free Google Drive error diagnostics
        run: python -m unittest discover -s tests -p 'test_jei_drive_heartbeat_ingest.py' -v
      - name: Read Colab heartbeat from authorized Drive (if configured)
        # Optional Drive access must not block the GitHub Actions compute fallback.
        continue-on-error: true
        env:
          JEI_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.JEI_DRIVE_SERVICE_ACCOUNT_JSON }}
          JEI_COLAB_HEARTBEAT_FILE_ID: ${{ vars.JEI_COLAB_HEARTBEAT_FILE_ID }}
        run: |
          if [ -n "$JEI_DRIVE_SERVICE_ACCOUNT_JSON" ] && [ -n "$JEI_COLAB_HEARTBEAT_FILE_ID" ]; then
            python -m pip install google-auth requests
          fi
          python -m tools.jei_drive_heartbeat_ingest --output audit-output/colab_watchdog.json
      - name: Execute read-only verification requested by a live Colab heartbeat
        shell: bash
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json
          from tools.jei_colab_coordination import merge_status
          with open("audit-output/colab_watchdog.json", encoding="utf-8") as source:
              status = json.load(source)
          with open("remote/pick_validation.json", encoding="utf-8") as source:
              picks = json.load(source)
          coordinated = merge_status(status, picks=picks, versioned=True)
          authorized = (status.get("drive_access") == "authenticated" and
                        status.get("status") == "RECENT_HEARTBEAT" and
                        status.get("colab_request") == "review_pick_quality" and
                        coordinated["colab_requested_audit"] == "review_pick_quality")
          raise SystemExit(0 if authorized else 1)
          PY
          then
            echo "Colab requested verified pick quality regression"
            python -m unittest discover -s tests -p 'test_pick*.py' -v
          else
            echo "No authenticated recent Colab review request; scheduled compute continues"
          fi
      - name: Validate bidirectional coordination and no-false-restart logic
        run: python -m unittest discover -s tests -p 'test_jei_colab_coordination.py' -v
      - name: Verify 10 simulated reciprocal Colab/Actions handoffs
        run: python -m unittest discover -s tests -p 'test_jei_colab_10_roundtrips.py' -v
      - name: Validate versioned task and result matching
        run: python -m unittest discover -s tests -p 'test_jei_colab_versioned_bridge.py' -v
      - name: Produce public, credential-free Colab handoff state
        run: python -m tools.jei_colab_coordination --watchdog audit-output/colab_watchdog.json --previous remote/colab_coordination.json --output audit-output/colab_coordination.json
      - name: Restore checkpoint from prior workflow runs
        id: checkpoint_restore
        uses: actions/cache/restore@v4
        with:
          path: audit-output/observed_checkpoint.json
          key: jei-observed-${{ runner.os }}-${{ hashFiles('remote/pick_validation.json', 'tools/jei_shared_compute.py', 'tools/jei_resumable_observed.py', 'tools/jei_batch_checkpoint.py') }}-${{ github.run_id }}
          restore-keys: |
            jei-observed-${{ runner.os }}-${{ hashFiles('remote/pick_validation.json', 'tools/jei_shared_compute.py', 'tools/jei_resumable_observed.py', 'tools/jei_batch_checkpoint.py') }}-
      - name: Report cached checkpoint candidate
        shell: bash
        env:
          RESTORED_CACHE_KEY: ${{ steps.checkpoint_restore.outputs.cache-matched-key }}
        run: |
          if [ -n "$RESTORED_CACHE_KEY" ] && [ -s audit-output/observed_checkpoint.json ]; then
            echo "CHECKPOINT_RESTORED_FROM_PREVIOUS_RUN=$RESTORED_CACHE_KEY"
            echo "Checkpoint candidate restored from prior run: $RESTORED_CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::CHECKPOINT_COLD_START: no prior checkpoint restored"
            echo "Checkpoint cold start: no prior checkpoint restored" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test interrupted and resumed computations
        run: python -m unittest discover -s tests -p 'test_jei_resumable_observed.py' -v
      - name: Run checkpointed observed batches
        run: python -m tools.jei_resumable_observed --input remote/pick_validation.json --checkpoint audit-output/observed_checkpoint.json --output audit-output/resumable_observed.json --recover-invalid-checkpoint
      - name: Persist checkpoint for future runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: audit-output/observed_checkpoint.json
          key: jei-observed-${{ runner.os }}-${{ hashFiles('remote/pick_validation.json', 'tools/jei_shared_compute.py', 'tools/jei_resumable_observed.py', 'tools/jei_batch_checkpoint.py') }}-${{ github.run_id }}
      - name: Verify artifact manifest
        run: python -m unittest discover -s tests -p 'test_jei_audit_manifest.py' -v
      - name: Index audit evidence
        if: always()
        run: python -m tools.jei_audit_manifest
      - name: Store audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jei-colab-audit-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce feed audit after publishing compute evidence
        if: always() && steps.feed_audit.outcome == 'failure'
        run: exit 1

  publish_coordination:
    # Scheduled audits AND successful main pushes must publish queued Colab
    # tasks. Otherwise a new task lives only in an Actions artifact until
    # GitHub eventually schedules a run (which may be delayed/skipped).
    # Branch-scoped push guard and the paths-ignore rule above prevent
    # PR/feature-branch publication and self-triggering commit loops.
    needs: audit
    if: >-
      needs.audit.result == 'success' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: jei-colab-coordination-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: jei-colab-audit-${{ github.run_id }}
          path: audit-output
      - name: Publish changed state only, never Drive credentials or heartbeat
        shell: bash
        run: |
          set -euo pipefail
          test -s audit-output/colab_coordination.json
          python -m json.tool audit-output/colab_coordination.json >/dev/null
          matches_current_snapshot() {
            python - <<'PY'
          import json
          from pathlib import Path
          from tools.jei_colab_coordination import publish_matches_current_snapshot
          candidate = json.loads(Path("audit-output/colab_coordination.json").read_text())
          picks = json.loads(Path("remote/pick_validation.json").read_text())
          try:
              current = json.loads(Path("remote/colab_coordination.json").read_text())
          except (OSError, ValueError):
              current = None
          raise SystemExit(0 if publish_matches_current_snapshot(candidate, current, picks) else 1)
          PY
          }
          if ! matches_current_snapshot; then
            echo "Skipping superseded or invalid coordination artifact"
            exit 0
          fi
          cp audit-output/colab_coordination.json remote/colab_coordination.json
          if git diff --quiet -- remote/colab_coordination.json && git ls-files --error-unmatch remote/colab_coordination.json >/dev/null 2>&1; then
            echo "Colab state unchanged; no repository write"
            exit 0
          fi
          git config user.name 'JEI Colab Coordination Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add remote/colab_coordination.json
          git commit -m 'data: publish Colab/Actions handoff state'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            if ! matches_current_snapshot; then
              echo "Newer snapshot or coordination state won the race; skipping old artifact"
              exit 0
            fi
            cp audit-output/colab_coordination.json remote/colab_coordination.json
            if git diff --quiet -- remote/colab_coordination.json; then
              echo "Handoff state was already published by another runner"
              exit 0
            fi
            git add remote/colab_coordination.json
            git commit -m 'data: publish Colab/Actions handoff state after race'
          done
          echo 'Could not publish coordination status safely' >&2
          exit 1
