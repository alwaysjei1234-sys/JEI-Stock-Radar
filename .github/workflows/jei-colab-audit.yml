name: JEI Compute Provenance Audit (GitHub Actions)
on:
  push:
    branches:
      - feature/actions-colab-audit-20261107
      - fix/hourly-colab-audit-20261113
      - fix/pick-quality-audit-20261113
      - fix/compute-provenance-20261113
      - feat/colab-verifiable-bridge-20261113
  pull_request:
    paths:
      - 'tools/jei_actions_audit.py'
      - 'tests/test_jei_actions_audit.py'
      - 'tools/jei_performance_quality.py'
      - 'tests/test_jei_performance_quality.py'
      - 'tools/jei_compute_provenance.py'
      - 'tests/test_jei_compute_provenance.py'
      - 'tools/jei_colab_report_validator.py'
      - 'tests/test_jei_colab_report_validator.py'
      - 'colab/JEI_Colab_Audit.ipynb'
      - '.github/workflows/jei-colab-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 * * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify audit logic
        run: python -m unittest discover -s tests -p 'test_jei_actions_audit.py' -v
      - name: Verify pick quality classifications
        run: python -m unittest discover -s tests -p 'test_jei_performance_quality.py' -v
      - name: Audit checked-out public feed
        run: python -m tools.jei_actions_audit --feed remote/system.json --out audit-output --commit "$GITHUB_SHA"
      - name: Record observed pick quality (not independent OOS)
        run: python -m tools.jei_performance_quality --input remote/pick_validation.json --out audit-output/pick_quality.json
      - name: Verify compute provenance tests
        run: python -m unittest discover -s tests -p 'test_jei_compute_provenance.py' -v
      - name: Record GitHub compute provenance (Colab unverified)
        run: python -m tools.jei_compute_provenance --quality audit-output/pick_quality.json --out audit-output/compute_provenance.json
      - name: Verify Colab report validation logic
        run: python -m unittest discover -s tests -p 'test_jei_colab_report_validator.py' -v
      - name: Validate notebook structure
        run: python -m json.tool colab/JEI_Colab_Audit.ipynb > /dev/null
      - name: Store audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jei-colab-audit-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
