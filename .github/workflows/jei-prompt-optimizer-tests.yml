name: JEI Prompt Optimizer Tests
on:
  pull_request:
    paths:
      - 'tools/jei_prompt_optimizer.py'
      - 'tests/test_jei_prompt_optimizer.py'
      - '.github/workflows/jei-prompt-optimizer-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_jei_prompt_optimizer.py' -v
