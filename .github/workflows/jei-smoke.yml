name: JEI Smoke Tests
on:
  push:
    paths:
      - 'remote/**'
      - 'scripts/**'
      - 'app/src/**'
      - 'tests/**'
      - '.github/workflows/jei-smoke.yml'
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend and privacy smoke checks
        run: node tests/smoke.cjs
      - name: Dashboard and Android bridge smoke checks
        run: node scripts/jei-smoke.mjs
      - name: Python generator syntax
        run: python -m py_compile scripts/update_system.py
      - name: Official-close simulated strategy tests
        run: |
          python -m py_compile scripts/update_paper_performance.py
          python -m unittest discover -s tests -p 'test_paper_performance.py' -v
      - name: Record test result
        if: always()
        run: |
          echo '## JEI smoke test status' >> "$GITHUB_STEP_SUMMARY"
          echo 'Frontend regression checks and Python generator syntax are executed above.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See step logs for the exact pass count and any failed assertions.' >> "$GITHUB_STEP_SUMMARY"
