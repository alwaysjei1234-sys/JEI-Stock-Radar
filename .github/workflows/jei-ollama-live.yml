name: JEI Real Ollama CPU Acceptance
on:
  push:
    branches: ['experiment/ollama-live-20261127']
    paths:
      - '.github/workflows/jei-ollama-live.yml'
      - 'tools/jei_ollama_live_acceptance.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_CONTEXT_LENGTH: '2048'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official CPU-compatible Ollama distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jei-ollama"
          curl --fail --location --retry 2 --max-time 180 https://ollama.com/download/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          sha256sum "$RUNNER_TEMP/ollama.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/jei-ollama"
          echo "$RUNNER_TEMP/jei-ollama/bin" >> "$GITHUB_PATH"
      - name: Start loopback server and pull real Qwen2.5 3B
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/jei-models"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:11434/api/version; then break; fi
            sleep 1
          done
          curl --silent --fail --max-time 5 http://127.0.0.1:11434/api/version
          timeout 300 ollama pull qwen2.5:3b
          ollama list
      - name: Execute actual live public manifest and local model acceptance
        run: python -m tools.jei_ollama_live_acceptance
      - name: Record evidence and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p audit-output
          if [ -f "$RUNNER_TEMP/ollama.log" ]; then tail -n 100 "$RUNNER_TEMP/ollama.log" > audit-output/ollama-server.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jei-real-ollama-evidence
          path: audit-output/
          if-no-files-found: warn
          retention-days: 7
