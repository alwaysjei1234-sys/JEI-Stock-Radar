# rebuild after feed/history stabilization 2026-10-06
name: Build JEI Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: write

concurrency:
  group: jei-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/cmdline-tools.zip
          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/android-cmdline/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable Android debug signing key
        id: jei-debug-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jei-android-debug-signing-v2

      - name: Ensure stable Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Package
        run: cp app/build/outputs/apk/debug/app-debug.apk "JEI_Stock_Radar_V3.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JEI-Stock-Radar-V3-APK
          path: "JEI_Stock_Radar_V3.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jei-latest --cleanup-tag --yes || true
          gh release create jei-latest "JEI_Stock_Radar_V3.apk" \
            --title "JEI Stock Radar latest" \
            --notes "Latest installable JEI Android build. The app checks remote/update.json and downloads this APK when an update is available."
