# rebuild after feed/history stabilization 2026-10-06
name: Build JEI Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      # Package the offline dashboard and rerun only APK-specific checks.
      - 'remote/index.html'
      - 'remote/update.json'
      - 'scripts/verify_android_apk.py'
      - 'tests/smoke.cjs'
      - 'tests/test_android_*.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: write
  actions: read

concurrency:
  group: jei-android-build
  cancel-in-progress: true

jobs:
  restore-verified-v42:
    if: "github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Restore verified Android 42 download')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore the byte-identical previous release asset
        shell: bash
        run: |
          set -euo pipefail
          previous='d482cf4ddad86edb6770551f1940e9a2a37ff9e43132ba089feb534c95e86cb8'
          incompatible='0845131c2822f7fd49120e4db4ddba50ae908388350f0c0e616a784280a9c8ff'
          asset='JEI_Stock_Radar_V3.apk'
          mkdir -p "$RUNNER_TEMP/current" "$RUNNER_TEMP/restore"
          gh release download jei-latest --pattern "$asset" --dir "$RUNNER_TEMP/current"
          current="$(sha256sum "$RUNNER_TEMP/current/$asset" | cut -d ' ' -f 1)"
          if [ "$current" = "$previous" ]; then
            echo 'Verified version 42 is already the stable download'
            exit 0
          fi
          if [ "$current" != "$incompatible" ]; then
            echo 'Stable download changed since verification. No rollback performed.'
            exit 1
          fi
          gh run download 43045089611 --name JEI-Stock-Radar-V3-APK --dir "$RUNNER_TEMP/restore"
          printf '%s  %s\n' "$previous" "$RUNNER_TEMP/restore/$asset" | sha256sum -c -
          gh release upload jei-latest "$RUNNER_TEMP/restore/$asset" --clobber

  build:
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Restore verified Android 42 download')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/cmdline-tools.zip
          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/android-cmdline/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Never generate another debug signer: Android updates require the original V42 certificate.
      - name: Restore original V42 signer from protected secret
        env:
          JEI_STABLE_KEYSTORE_B64: ${{ secrets.JEI_STABLE_KEYSTORE_B64 }}
          JEI_STORE_PASSWORD: ${{ secrets.JEI_STORE_PASSWORD }}
          JEI_KEY_ALIAS: ${{ secrets.JEI_KEY_ALIAS }}
          JEI_KEY_PASSWORD: ${{ secrets.JEI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JEI_STABLE_KEYSTORE_B64:-}" ] || [ -z "${JEI_STORE_PASSWORD:-}" ] || [ -z "${JEI_KEY_ALIAS:-}" ] || [ -z "${JEI_KEY_PASSWORD:-}" ]; then
            echo 'Original V42 keystore credentials missing; refusing incompatible update. Never generate another signer.'
            exit 1
          fi
          python - <<'PY'
          import base64, os
          from pathlib import Path
          target=Path(os.environ['RUNNER_TEMP'])/'jei-original-signing-key.jks'
          raw=base64.b64decode(os.environ['JEI_STABLE_KEYSTORE_B64'],validate=True)
          if len(raw)<100:raise ValueError('Invalid original signer keystore')
          target.write_bytes(raw)
          target.chmod(0o600)
          PY
          echo "JEI_KEYSTORE=$RUNNER_TEMP/jei-original-signing-key.jks" >> "$GITHUB_ENV"
          actual="$(keytool -exportcert -keystore "$RUNNER_TEMP/jei-original-signing-key.jks" -storepass "$JEI_STORE_PASSWORD" -alias "$JEI_KEY_ALIAS" | openssl dgst -sha256 | awk '{print $NF}')"
          expected='807326371643b70ec340b8fd526568adb9ff86c8186e059ca6bc5d0633e4cbdd'
          if [ "$actual" != "$expected" ]; then
            echo 'Provided key does not match original V42 signing certificate; refusing installation-incompatible APK.'
            exit 1
          fi
          echo 'Original V42 signing certificate verified'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Package current verified dashboard as offline fallback
        run: |
          cp remote/index.html app/src/main/assets/index.html
          node - <<'NODE'
          const fs = require('fs');
          const remote = fs.readFileSync('remote/index.html', 'utf8');
          const offline = fs.readFileSync('app/src/main/assets/index.html', 'utf8');
          if (remote !== offline || !offline.includes('function isTrustedFeed(') ||
              !offline.includes('function renderHoldAlerts(') ||
              !offline.includes('JEI_PRIVATE_APP')) process.exit(1);
          console.log('PASS Android fallback matches current verified dashboard');
          NODE
          node tests/smoke.cjs

      - name: Build installable APK with original certificate
        env:
          JEI_STORE_PASSWORD: ${{ secrets.JEI_STORE_PASSWORD }}
          JEI_KEY_ALIAS: ${{ secrets.JEI_KEY_ALIAS }}
          JEI_KEY_PASSWORD: ${{ secrets.JEI_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify built APK identity before publication
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk > /tmp/jei-apk-badging.txt
          python -m scripts.verify_android_apk --badging /tmp/jei-apk-badging.txt

      - name: Package
        run: cp app/build/outputs/apk/release/app-release.apk "JEI_Stock_Radar_V3.apk"

      - name: Verify stable update signer
        shell: bash
        run: |
          set -euo pipefail
          # Pin the certificate from the verified, publicly shipped version 42.
          expected='807326371643b70ec340b8fd526568adb9ff86c8186e059ca6bc5d0633e4cbdd'
          cert_report="$RUNNER_TEMP/jei-signing-cert.txt"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "JEI_Stock_Radar_V3.apk" > "$cert_report"
          python -m scripts.verify_android_apk --cert-report "$cert_report" --expected-cert "$expected"

      - name: Check Android upgrade version is newer
        id: upgrade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from scripts.verify_android_apk import verify
          old=json.loads(Path('remote/update.json').read_text(encoding='utf-8'))
          current=verify(Path('/tmp/jei-apk-badging.txt').read_text(encoding='utf-8'),Path('app/build.gradle').read_text(encoding='utf-8'))
          if type(old.get('versionCode')) is not int or current['versionCode'] < old['versionCode']:
              raise SystemExit('Published version is invalid or APK is a downgrade')
          if current['versionCode'] == old['versionCode'] and current['versionName'] != old.get('versionName'):
              raise SystemExit('A versionCode cannot be reused for a different versionName')
          print('publish='+('true' if current['versionCode'] > old['versionCode'] else 'false'))
          PY

      - name: Upload verified signed APK artifact
        if: steps.upgrade.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JEI-Stock-Radar-V3-APK
          path: "JEI_Stock_Radar_V3.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK download
        if: steps.upgrade.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view jei-latest >/dev/null 2>&1; then
            gh release upload jei-latest "JEI_Stock_Radar_V3.apk" --clobber
          else
            gh release create jei-latest "JEI_Stock_Radar_V3.apk" \
              --title "JEI Stock Radar latest" \
              --notes "Latest installable JEI Android build. The app checks remote/update.json and downloads this APK when an update is available."
          fi

      - name: Advertise version only after signed APK release asset exists
        if: steps.upgrade.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='807326371643b70ec340b8fd526568adb9ff86c8186e059ca6bc5d0633e4cbdd'
          git config user.name "JEI Android Release Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            python -m scripts.publish_android_update_manifest \
              --badging /tmp/jei-apk-badging.txt \
              --cert-report "$RUNNER_TEMP/jei-signing-cert.txt" \
              --expected-cert "$expected"
            if git diff --quiet -- remote/update.json; then
              echo 'Verified Android update metadata already current'
              exit 0
            fi
            git add remote/update.json
            git commit -m "data: advertise verified Android release version"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.verify_android_apk --badging /tmp/jei-apk-badging.txt
          done
          echo 'APK released but update metadata still unavailable; leave old advertised version'
          exit 1
