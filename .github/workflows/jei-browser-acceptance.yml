name: JEI Mobile Browser Acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/mobile_browser.cjs'
      - 'tests/fixtures/free_research.json'
      - 'tests/fixtures/daily_news_watch.json'
      - 'remote/index.html'
      - 'remote/cash.html'
      - 'remote/paper.html'
      - 'remote/holding-health.html'
      - 'remote/holding-health.js'
      - 'remote/holding-research.js'
      - 'remote/free_research.json'
      - 'remote/research_source_directory.json'
      - 'remote/gooaye_watch.json'
      - 'remote/daily_news_watch.json'
      - 'remote/video_upload_watch.json'
      - 'remote/video_research_sources.json'
      - 'tests/fixtures/video_upload_watch.json'
      - 'tests/holding_health.cjs'
      - 'tests/holding_research.test.cjs'
      - '.github/workflows/jei-browser-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'tests/mobile_browser.cjs'
      - 'tests/fixtures/free_research.json'
      - 'tests/fixtures/daily_news_watch.json'
      - 'remote/index.html'
      - 'remote/cash.html'
      - 'remote/paper.html'
      - 'remote/holding-health.html'
      - 'remote/holding-health.js'
      - 'remote/holding-research.js'
      - 'remote/free_research.json'
      - 'remote/research_source_directory.json'
      - 'remote/gooaye_watch.json'
      - 'remote/daily_news_watch.json'
      - 'remote/video_upload_watch.json'
      - 'remote/video_research_sources.json'
      - 'tests/fixtures/video_upload_watch.json'
      - 'tests/holding_health.cjs'
      - 'tests/holding_research.test.cjs'
      - '.github/workflows/jei-browser-acceptance.yml'

permissions:
  contents: read

jobs:
  mobile-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test mobile dashboard, private holding health, chat and cloud paper
        run: node tests/mobile_browser.cjs
      - name: Verify private research calculations
        run: node tests/holding_research.test.cjs
