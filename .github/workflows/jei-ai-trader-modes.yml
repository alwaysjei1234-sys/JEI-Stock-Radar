name: JEI Five AI Trader Modes
on:
  pull_request:
    paths:
      - 'config/jei_ai_trader_profile.json'
      - 'tools/jei_ai_trader_modes.py'
      - 'tests/test_jei_ai_trader_modes.py'
      - '.github/workflows/jei-ai-trader-modes.yml'
  workflow_dispatch:
jobs:
  schema-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_jei_ai_trader_modes.py' -v
