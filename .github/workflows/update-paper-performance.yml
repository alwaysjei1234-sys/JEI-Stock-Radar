name: JEI Daily Paper Strategy Benchmark
on:
  schedule:
    # 20:25 Taipei time, weekdays; official daily closes must already be available.
    - cron: '25 12 * * 1-5'
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/update_paper_performance.py'
      - 'scripts/update_pick_validation.py'
      - 'remote/pick_validation.html'
      - 'tests/test_pick_validation.py'
      - '.github/workflows/update-paper-performance.yml'

permissions:
  contents: write

concurrency:
  group: jei-paper-strategy-benchmark
  cancel-in-progress: true

jobs:
  daily-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test no-look-ahead and cost assumptions
        run: python -m unittest discover -s tests -p 'test_paper_performance.py' -v
      - name: Verify forward-only picked-stock analysis and no hindsight
        run: python -m unittest discover -s tests -p 'test_pick_validation.py' -v
      - name: Generate daily public paper-only benchmark
        run: python scripts/update_paper_performance.py
      - name: Freeze daily picks and generate 3-60 trading-day report
        run: python scripts/update_pick_validation.py
      - name: Publish paper benchmark and immutable picked-stock validation
        run: |
          git add -N remote/strategy_performance.json remote/pick_history.json remote/pick_validation.json
          if git diff --quiet -- remote/strategy_performance.json remote/pick_history.json remote/pick_validation.json; then
            echo "No validated new daily closes or paper scorecard change"
            exit 0
          fi
          git config user.name "JEI Paper Strategy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add remote/strategy_performance.json remote/pick_history.json remote/pick_validation.json
          git commit -m "Auto-update official paper performance and picked-stock outcomes"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push raced with other data writers: $i"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "Paper strategy publish failed"
          exit 1
