name: JEI Multi-AI Evolution Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/jei_evolution_gate.py'
      - 'tests/test_jei_evolution_gate.py'
      - '.github/workflows/jei-evolution-gate.yml'
permissions:
  contents: read
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_jei_evolution_gate.py' -v
      - name: Example fail-closed rejection
        run: |
          mkdir -p evolution-output
          echo '{}' > evolution-output/untrusted.json
          if python -m tools.jei_evolution_gate --input evolution-output/untrusted.json --output evolution-output/evaluation.json; then
            echo "ERROR: unverified proposal was accepted"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolution-gate-tests
          path: evolution-output/
          retention-days: 30
