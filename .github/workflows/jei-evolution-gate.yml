name: JEI Multi-AI Evolution Gate
on:
  workflow_dispatch:
    inputs:
      candidate_evaluation_json:
        description: 'Optional public, non-sensitive multi-model evaluation JSON (no keys/holdings)'
        required: false
        type: string
  schedule:
    - cron: '40 9 * * 1-5'
  pull_request:
    paths:
      - 'tools/jei_evolution_gate.py'
      - 'tests/test_jei_evolution_gate.py'
      - '.github/workflows/jei-evolution-gate.yml'
permissions:
  contents: read
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_jei_evolution_gate.py' -v
      - name: Evaluate supplied candidate without promotion
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_evaluation_json != ''
        env:
          CANDIDATE_JSON: ${{ inputs.candidate_evaluation_json }}
        run: |
          mkdir -p evolution-output
          printf '%s' "$CANDIDATE_JSON" > evolution-output/candidate.json
          python -m tools.jei_evolution_gate --input evolution-output/candidate.json --output evolution-output/candidate-evaluation.json || true
          cat evolution-output/candidate-evaluation.json
      - name: Verify scheduled run does not claim model collaboration
        run: |
          mkdir -p evolution-output
          python - <<'PY'
          import json, datetime, pathlib
          result = {'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'model_collaboration': 'NOT_CONNECTED',
                    'backtest': 'NOT_EXECUTED',
                    'promotion': 'BLOCKED',
                    'reason': 'No verified independent AI proposals and out-of-sample evidence supplied'}
          pathlib.Path('evolution-output/status.json').write_text(json.dumps(result, indent=2))
          PY
      - name: Example fail-closed rejection
        run: |
          mkdir -p evolution-output
          echo '{}' > evolution-output/untrusted.json
          if python -m tools.jei_evolution_gate --input evolution-output/untrusted.json --output evolution-output/evaluation.json; then
            echo "ERROR: unverified proposal was accepted"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolution-gate-tests
          path: evolution-output/
          retention-days: 30
