name: Update JEI Market Feed
# JEI feed trigger v3: re-run after first verified OHLCV backfill

on:
  schedule:
    # Every 5 minutes, 09:00-19:55 Taiwan time (UTC+8), best effort GitHub Actions; keep running after close until official
    # TWSE/TPEx daily files have rolled to the current trading date.
    - cron: '30,45 0 * * 1-5' # 08:30/08:45 Taipei: pre-open feed preparation (not live prices)
    - cron: '*/5 1-11 * * 1-5'
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/update_system.py'
      - 'tests/test_update_system_recovery.py'
      - 'tests/test_validate_market_session.py'
      - 'scripts/validate_market_session.py'
      - 'data/twse_ohlcv/**'
      - '.github/workflows/backfill-twse-ohlcv.yml'
      - '.github/workflows/update-system.yml'

permissions:
  contents: write

concurrency:
  group: jei-market-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate feed builder syntax
        run: python -m py_compile scripts/update_system.py
      - name: Test damaged-feed recovery before market access
        run: python -m unittest discover -s tests -p 'test_update_system_recovery.py'
      - name: Build market feed
        run: python scripts/update_system.py
      - name: Reject stale holiday labels and false current closes
        run: |
          python -m unittest discover -s tests -p 'test_validate_market_session.py'
          python -m scripts.validate_market_session remote/system.json
      - name: Audit live quote coverage (diagnostic only)
        continue-on-error: true
        run: python scripts/audit_feed_health.py remote/system.json
      - name: Collect public research headlines
        continue-on-error: true
        run: python scripts/collect_news_rss.py
      - name: Publish JEI market files
        run: |
          if git diff --quiet -- remote/system.json remote/history.json remote/daily_prices.json remote/news_intelligence.json; then
            echo "No feed change"
            exit 0
          fi
          git config user.name "JEI Market Bot"
          git config user.email "actions@users.noreply.github.com"
          git add remote/system.json remote/history.json remote/daily_prices.json remote/news_intelligence.json
          git commit -m "Auto-update JEI market feed"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            if [ "$i" = 4 ]; then break; fi
            echo "Push raced with another main update; rebuilding feed on latest main (attempt $i)"
            # Rebasing generated JSON causes unresolvable content conflicts.
            # Rebuild from the latest main instead; never force-push or discard
            # another writer's market status, holdings or research updates.
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_system.py
            python -m scripts.validate_market_session remote/system.json
            python scripts/collect_news_rss.py || echo "RSS refresh unavailable during retry"
            if git diff --quiet -- remote/system.json remote/history.json remote/daily_prices.json remote/news_intelligence.json; then
              echo "Latest main already contains the refreshed feed"
              exit 0
            fi
            git add remote/system.json remote/history.json remote/daily_prices.json remote/news_intelligence.json
            git commit -m "Auto-update JEI market feed after push race"
            sleep 3
          done
          echo "Feed publish failed after rebuilding on latest main"
          exit 1
      - name: Optional verified intraday LINE risk or momentum alert
        if: github.event_name == 'schedule'
        env:
          JEI_LINE_ENABLED: ${{ vars.JEI_LINE_ENABLED }}
          # The owner requested activation after the real LINE push test.
          # Existing JEI_LINE_ENABLED remains the master explicit opt-in.
          # Set JEI_LINE_ALERTS_ENABLED=false to disable intraday extras only.
          JEI_LINE_ALERTS_ENABLED: ${{ vars.JEI_LINE_ENABLED == 'true' && vars.JEI_LINE_ALERTS_ENABLED != 'false' }}
          JEI_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.JEI_LINE_CHANNEL_ACCESS_TOKEN }}
          JEI_LINE_USER_ID: ${{ secrets.JEI_LINE_USER_ID }}
        run: python -m scripts.send_line_alert
