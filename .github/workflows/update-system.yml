name: Update JEI Market Feed
# JEI feed trigger v2

on:
  schedule:
    - cron: '*/15 1-5 * * 1-5'
    - cron: '0,5,10 6 * * 1-5'
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/update_system.py'
      - '.github/workflows/update-system.yml'

permissions:
  contents: write

concurrency:
  group: jei-market-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build market feed
        run: python scripts/update_system.py
      - name: Publish JEI market files
        run: |
          if git diff --quiet -- remote/system.json remote/history.json; then
            echo "No feed change"
            exit 0
          fi
          git config user.name "JEI Market Bot"
          git config user.email "actions@users.noreply.github.com"
          git add remote/system.json remote/history.json
          git commit -m "Auto-update JEI market feed"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push raced with another main update; rebasing feed commit (attempt $i)"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "Feed publish failed after retries"
          exit 1
