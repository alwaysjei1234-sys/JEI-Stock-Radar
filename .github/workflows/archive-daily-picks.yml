name: JEI immutable daily pick archive

on:
  schedule:
    # 19:30 Asia/Taipei on weekdays, after TWSE/TPEX closing feeds.
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jei-daily-pick-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record only today's completed market snapshot
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          FEED_DATE=$(python -c 'import json;print(json.load(open("remote/system.json",encoding="utf-8"))["data_date"])')
          TAIPEI_DATE=$(TZ=Asia/Taipei date +%F)
          if [ "$FEED_DATE" != "$TAIPEI_DATE" ]; then
            echo "No same-day completed feed ($FEED_DATE vs $TAIPEI_DATE); skip."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TARGET="data/pick_snapshots/$FEED_DATE.json"
          if [ -e "$TARGET" ]; then
            echo "Snapshot already exists; preserve immutable original."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            python -m scripts.export_daily_picks --output "$TARGET" --limit 10
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi
          PRICE_TARGET="data/feed_closes/$FEED_DATE.json"
          if [ ! -e "$PRICE_TARGET" ]; then
            python -m scripts.export_feed_closes --output "$PRICE_TARGET"
          fi
      - name: Verify archive and scoring regression tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate diagnostic leaderboard
        run: python -m scripts.build_diagnostic_leaderboard --output remote/paper-leaderboard.json
      - name: Commit archive and updated diagnostic leaderboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/pick_snapshots/ data/feed_closes/ remote/paper-leaderboard.json
          if git diff --cached --quiet; then
            echo "No archive or leaderboard changes."
            exit 0
          fi
          git commit -m "data(paper): update immutable archives and diagnostic leaderboard"
          git pull --rebase origin main
          git push origin HEAD:main
