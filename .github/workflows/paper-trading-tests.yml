name: JEI Paper Trading Tests
on:
  pull_request:
    paths:
      - 'tools/paper_sim.py'
      - 'tools/__init__.py'
      - 'tests/test_paper_sim.py'
      - '.github/workflows/paper-trading-tests.yml'
  workflow_dispatch:
jobs:
  paper-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run paper trading unit tests
        run: python -m unittest discover -s tests -p 'test_paper_sim.py' -v
