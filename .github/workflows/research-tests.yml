name: JEI Research Engine Tests
on:
  push:
    paths:
      - 'remote/forecast_audit.js'
      - 'remote/target_consensus.js'
      - 'remote/research_engine.js'
      - 'tests/**'
      - 'scripts/update_pick_validation.py'
      - 'scripts/pick_risk_metrics.py'
      - 'remote/pick_history.json'
      - 'remote/pick_validation.json'
      - 'remote/daily_prices.json'
      - '.github/workflows/research-tests.yml'
  pull_request:
    paths:
      - 'remote/forecast_audit.js'
      - 'remote/target_consensus.js'
      - 'remote/research_engine.js'
      - 'tests/**'
      - 'scripts/update_pick_validation.py'
      - 'scripts/pick_risk_metrics.py'
      - 'remote/pick_history.json'
      - 'remote/pick_validation.json'
      - '.github/workflows/research-tests.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'
    # Hourly integrity checks; CI validates and reports, but does not auto-merge code.
    - cron: '0 * * * *'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen pick archive integrity
        run: node tests/pick_archive.test.cjs
      - name: Python pick validation
        run: python3 -m unittest discover -s tests -p test_pick_validation.py
      - name: Forecast audit
        run: node tests/forecast_audit.test.cjs
      - name: Target consensus
        run: node tests/target_consensus.test.cjs
      - name: Research engine
        run: node tests/research_engine.test.cjs
      - name: Open or update failure issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='JEI 每日自動驗證失敗'
          existing=$(gh issue list --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          body="每日自動測試失敗。請檢查 [執行紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})，修正後重新執行測試；未驗證前不要改寫歷史績效。"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label bug || gh issue create --title "$title" --body "$body"
          fi
