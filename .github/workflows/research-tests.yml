name: JEI Research Engine Tests
on:
  push:
    paths:
      - 'remote/forecast_audit.js'
      - 'remote/target_consensus.js'
      - 'remote/research_engine.js'
      - 'remote/holding-health.html'
      - 'remote/holding-health.js'
      - 'remote/holding-research.js'
      - 'remote/strategy_integration.js'
      - 'remote/paper.html'
      - 'remote/cash.html'
      - 'api/consult.js'
      - 'remote/free_research.json'
      - 'remote/research_source_directory.json'
      - 'remote/gooaye_watch.json'
      - 'remote/daily_news_watch.json'
      - 'scripts/update_daily_news_watch.py'
      - 'remote/video_upload_watch.json'
      - 'remote/video_research_sources.json'
      - 'scripts/update_video_upload_watch.py'
      - 'scripts/update_gooaye_watch.py'
      - 'remote/index.html'
      - 'tests/**'
      - 'scripts/update_pick_validation.py'
      - 'scripts/update_system.py'
      - 'scripts/strategy_health.py'
      - 'tools/jei_strategy_evolution.py'
      - 'tools/jei_strategy_cohort_audit.py'
      - 'scripts/market_sessions.py'
      - 'scripts/pick_risk_metrics.py'
      - 'remote/pick_history.json'
      - 'remote/pick_validation.json'
      - 'remote/daily_prices.json'
      - '.github/workflows/research-tests.yml'
  pull_request:
    paths:
      - 'remote/forecast_audit.js'
      - 'remote/target_consensus.js'
      - 'remote/research_engine.js'
      - 'remote/holding-health.html'
      - 'remote/holding-health.js'
      - 'remote/holding-research.js'
      - 'remote/free_research.json'
      - 'remote/research_source_directory.json'
      - 'remote/gooaye_watch.json'
      - 'remote/daily_news_watch.json'
      - 'scripts/update_daily_news_watch.py'
      - 'remote/video_upload_watch.json'
      - 'remote/video_research_sources.json'
      - 'scripts/update_video_upload_watch.py'
      - 'scripts/update_gooaye_watch.py'
      - 'tests/**'
      - 'scripts/update_pick_validation.py'
      - 'scripts/update_system.py'
      - 'scripts/strategy_health.py'
      - 'tools/jei_strategy_evolution.py'
      - 'tools/jei_strategy_cohort_audit.py'
      - 'scripts/market_sessions.py'
      - 'scripts/pick_risk_metrics.py'
      - 'remote/pick_history.json'
      - 'remote/pick_validation.json'
      - '.github/workflows/research-tests.yml'
  workflow_dispatch:
  schedule:
    # Hourly integrity checks; CI validates and reports, but does not auto-merge code.
    - cron: '0 * * * *'
concurrency:
  group: jei-research-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dashboard smoke tests
        run: node tests/dashboard_smoke.test.cjs
      - name: Shared strategy quality wiring (home, AI, paper, cash)
        run: node tests/strategy_integration.test.cjs
      - name: Frozen pick archive integrity
        run: node tests/pick_archive.test.cjs
      - name: Guard retrospective external screenshot watchlist against fake OOS promotion
        run: python3 -m unittest discover -s tests -p 'test_external_screenshot_cohorts.py' -v
      - name: Python pick validation
        run: python3 -m unittest discover -s tests -p 'test_pick*.py'
      - name: Strategy loss-feedback guard (lookahead safe)
        run: python3 -m unittest discover -s tests -p 'test_strategy_health.py' -v
      - name: Verify registered forward-only strategy comparisons
        run: python3 -m unittest discover -s tests -p 'test_jei_strategy_evolution.py' -v
      - name: Verify immutable signal ledger and official close cohorts
        run: python3 -m unittest discover -s tests -p 'test_jei_strategy_cohort_audit.py' -v
      - name: Run preregistered radar comparison (NO automatic policy promotion)
        run: python3 -m tools.jei_strategy_evolution --input remote/pick_validation.json --ledger remote/pick_history.json --prices remote/daily_prices.json --out audit-output/strategy_evolution.json
      - name: Archive prospective strategy research evidence
        uses: actions/upload-artifact@v4
        with:
          name: jei-strategy-evolution-${{ github.run_id }}
          path: audit-output/strategy_evolution.json
          if-no-files-found: error
          retention-days: 30
      - name: Forecast audit
        run: node tests/forecast_audit.test.cjs
      - name: Target consensus
        run: node tests/target_consensus.test.cjs
      - name: Private holding research workbench
        run: node tests/holding_research.test.cjs
      - name: Research engine
        run: node tests/research_engine.test.cjs
      - name: Open or update failure issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='JEI 自動驗證失敗'
          existing=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          body="自動測試失敗。請檢查 [執行紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})，修正後重新執行測試；未驗證前不要改寫歷史績效。"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label bug || gh issue create --title "$title" --body "$body"
          fi
