      - '.github/workflows/archive-daily-picks.yml'
      - '.github/workflows/acceptance-feed.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: read

jobs:
  feed-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate remote feed and update metadata
        run: python scripts/acceptance_feed_smoke.py
      - name: Test AI consultation request validation
        run: node --test tests/ai_consult.test.js
      - name: Check Python source syntax
        run: python -m compileall -q scripts tests
      - name: Test forward-only paper performance
        run: python -m unittest discover -s tests -p 'test_*.py'
