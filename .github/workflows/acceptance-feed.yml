name: JEI feed acceptance

on:
  push:
    branches: [main]
    paths:
      - 'remote/system.json'
      - 'remote/update.json'
      - 'remote/index.html'
      - 'scripts/acceptance_feed_smoke.py'
      - 'scripts/forward_pick_score.py'
      - 'tests/test_forward_pick_score.py'
      - 'scripts/paper_score_summary.py'
      - 'tests/test_paper_score_summary.py'
      - 'scripts/paper_benchmark.py'
      - 'tests/test_paper_benchmark.py'
      - 'scripts/paper_report.py'
      - 'tests/test_paper_report.py'
      - 'scripts/export_daily_picks.py'
      - 'tests/test_export_daily_picks.py'
      - 'scripts/collect_pick_snapshots.py'
      - 'tests/test_collect_pick_snapshots.py'
      - 'tests/test_trading_calendar.py'
      - 'scripts/export_feed_closes.py'
      - 'tests/test_export_feed_closes.py'
      - 'scripts/collect_feed_closes.py'
      - 'tests/test_collect_feed_closes.py'
      - 'scripts/run_archived_paper_pipeline.py'
      - 'tests/test_archived_paper_pipeline.py'
      - '.github/workflows/archive-daily-picks.yml'
      - '.github/workflows/acceptance-feed.yml'
  pull_request:
    paths:
      - 'remote/system.json'
      - 'remote/update.json'
      - 'remote/index.html'
      - 'scripts/acceptance_feed_smoke.py'
      - 'scripts/forward_pick_score.py'
      - 'tests/test_forward_pick_score.py'
      - 'scripts/paper_score_summary.py'
      - 'tests/test_paper_score_summary.py'
      - 'scripts/paper_benchmark.py'
      - 'tests/test_paper_benchmark.py'
      - 'scripts/paper_report.py'
      - 'tests/test_paper_report.py'
      - 'scripts/export_daily_picks.py'
      - 'tests/test_export_daily_picks.py'
      - 'scripts/collect_pick_snapshots.py'
      - 'tests/test_collect_pick_snapshots.py'
      - 'tests/test_trading_calendar.py'
      - 'scripts/export_feed_closes.py'
      - 'tests/test_export_feed_closes.py'
      - 'scripts/collect_feed_closes.py'
      - 'tests/test_collect_feed_closes.py'
      - 'scripts/run_archived_paper_pipeline.py'
      - 'tests/test_archived_paper_pipeline.py'
      - '.github/workflows/archive-daily-picks.yml'
      - '.github/workflows/acceptance-feed.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: read

jobs:
  feed-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate remote feed and update metadata
        run: python scripts/acceptance_feed_smoke.py
      - name: Test forward-only paper performance
        run: python -m unittest discover -s tests -p 'test_*.py'
