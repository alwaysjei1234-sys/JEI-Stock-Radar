name: JEI Daily Brief and Optional LINE
on:
  schedule:
    # UTC / Taipei: morning + backups; 15:30 build; 18:10 close + 18:40/19:10 backups.
    - cron: '55 0 * * 1-5'
    - cron: '10 1 * * 1-5' # 09:10 Taipei backup; LINE retry key deduplicates
    - cron: '25 1 * * 1-5' # 09:25 second backup if GitHub schedule is delayed
    - cron: '30 7 * * 1-5'
    - cron: '10 10 * * 1-5'
    - cron: '40 10 * * 1-5' # 18:40 Taipei backup; same date/edition retry key
    - cron: '10 11 * * 1-5' # 19:10 second backup; accepted reports are deduplicated
  workflow_dispatch:
    inputs:
      edition:
        description: "morning or close"
        type: choice
        options: [morning, close]
        required: true
      send_line:
        description: "Explicitly retry LINE dispatch (still requires master switch, verified date and free quota)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/build_daily_brief.py'
      - 'scripts/send_line_brief.py'
      - 'scripts/line_outbox.py'
      - 'tests/test_line_outbox.py'
      - 'scripts/publish_line_status.py'
      - 'tests/test_daily_brief.py'
      - 'tests/test_daily_brief_publish.py'
      - 'tests/test_line_dispatch.py'
      - 'tests/test_line_payload_coverage.py'
      - 'tests/test_line_status.py'
      - 'tests/line_status.test.cjs'
      - 'remote/brief.html'
      - 'tests/test_send_line_alert.py'
      - 'scripts/send_line_alert.py'
      - '.github/workflows/jei-daily-brief.yml'
permissions:
  contents: write
concurrency:
  group: jei-daily-brief
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test briefing and LINE safety
        run: |
          python -m unittest discover -s tests -p 'test_daily_brief.py' -v
          python -m unittest discover -s tests -p 'test_daily_brief_publish.py' -v
          python -m unittest discover -s tests -p 'test_send_line_alert.py' -v
          python -m unittest discover -s tests -p 'test_line_dispatch.py' -v
          python -m unittest discover -s tests -p 'test_line_outbox.py' -v
          python -m unittest discover -s tests -p 'test_line_payload_coverage.py' -v
          python -m unittest discover -s tests -p 'test_line_status.py' -v
          node tests/line_status.test.cjs
      - name: Select edition and LINE policy
        id: edition
        env:
          SCHEDULE: ${{ github.event.schedule }}
          SELECTED: ${{ inputs.edition }}
          MANUAL_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.send_line }}
        run: |
          if [ "$SCHEDULE" = '55 0 * * 1-5' ] || [ "$SCHEDULE" = '10 1 * * 1-5' ] || [ "$SCHEDULE" = '25 1 * * 1-5' ]; then
            echo 'name=morning' >> "$GITHUB_OUTPUT"
            echo 'send=true' >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = '10 10 * * 1-5' ] || [ "$SCHEDULE" = '40 10 * * 1-5' ] || [ "$SCHEDULE" = '10 11 * * 1-5' ]; then
            echo 'name=close' >> "$GITHUB_OUTPUT"
            echo 'send=true' >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = '30 7 * * 1-5' ]; then
            echo 'name=close' >> "$GITHUB_OUTPUT"
            echo 'send=false' >> "$GITHUB_OUTPUT"
          else
            echo "name=${SELECTED:-close}" >> "$GITHUB_OUTPUT"
            if [ "$MANUAL_SEND" = 'true' ]; then
              echo 'send=true' >> "$GITHUB_OUTPUT"
            else
              echo 'send=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Generate public brief using verified official close
        run: python scripts/build_daily_brief.py --edition "${{ steps.edition.outputs.name }}"
      - name: Publish verified report
        run: |
          git config user.name 'JEI Research Brief Bot'
          git config user.email 'actions@users.noreply.github.com'
          for i in 1 2 3; do
            if [ "${{ steps.edition.outputs.send }}" = 'true' ]; then
              python -m scripts.line_outbox --edition "${{ steps.edition.outputs.name }}"
            fi
            git add remote/brief.json
            if [ -f remote/line_outbox.json ]; then git add remote/line_outbox.json; fi
            if git diff --cached --quiet; then
              echo 'Brief unchanged'
              exit 0
            fi
            git commit -m 'Auto-update JEI daily research brief'
            if git push; then exit 0; fi
            if [ "$i" = 3 ]; then break; fi
            # Generated JSON must be rebuilt, not rebased through another
            # writer's report. This is a disposable Actions checkout; keep
            # all published main changes before rebuilding the selected edition.
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_daily_brief.py --edition "${{ steps.edition.outputs.name }}"
            sleep 3
          done
          echo 'Could not publish; LINE step will not run'
          exit 1
      - name: Explain LINE dispatch decision
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          EDITION: ${{ steps.edition.outputs.name }}
          SEND: ${{ steps.edition.outputs.send }}
        run: |
          echo "JEI LINE decision: event=$EVENT schedule=$SCHEDULE edition=$EDITION eligible=$SEND"
          if [ "$SEND" != 'true' ]; then echo 'LINE skipped by schedule policy (push and manual builds without explicit send_line do not send)'; fi
      - name: Optional LINE push (no email)
        if: steps.edition.outputs.send == 'true'
        env:
          JEI_LINE_ENABLED: ${{ vars.JEI_LINE_ENABLED }}
          JEI_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.JEI_LINE_CHANNEL_ACCESS_TOKEN }}
          JEI_LINE_USER_ID: ${{ secrets.JEI_LINE_USER_ID }}
        run: python scripts/send_line_brief.py --edition "${{ steps.edition.outputs.name }}" --outbox remote/line_outbox.json --result-path "${{ runner.temp }}/jei-line-result.json"
      - name: Preserve LINE API acceptance result
        if: always() && steps.edition.outputs.send == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jei-line-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jei-line-result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish public LINE decision without recipient or credentials
        if: always() && steps.edition.outputs.send == 'true'
        env:
          LINE_RECEIPT_PATH: ${{ runner.temp }}/jei-line-result.json
          LINE_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/publish_line_status.py --receipt "$LINE_RECEIPT_PATH" --run-id "$LINE_RUN_ID"
          for i in 1 2 3; do
            if git diff --quiet -- remote/line_status.json && git ls-files --error-unmatch remote/line_status.json >/dev/null 2>&1; then exit 0; fi
            git config user.name 'JEI LINE Status Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add remote/line_status.json
            git commit -m 'Auto-update public LINE dispatch status'
            if git push; then exit 0; fi
            if [ "$i" = 3 ]; then break; fi
            # Receipt lives outside checkout; merge it into the latest main
            # after a race, preserving newer records and all unrelated files.
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_line_status.py --receipt "$LINE_RECEIPT_PATH" --run-id "$LINE_RUN_ID"
          done
          echo 'LINE status could not be published; API artifact remains available'
          exit 1
