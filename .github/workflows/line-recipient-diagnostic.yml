name: Read-only LINE recipient diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_line_recipient.py'
      - 'tests/test_line_recipient_diagnostic.py'
      - '.github/workflows/line-recipient-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate diagnostic tests
        run: python -m unittest discover -s tests -p 'test_line_recipient_diagnostic.py' -v
      - name: Inspect configured recipient without sending any message
        env:
          JEI_LINE_ENABLED: ${{ vars.JEI_LINE_ENABLED }}
          JEI_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.JEI_LINE_CHANNEL_ACCESS_TOKEN }}
          JEI_LINE_USER_ID: ${{ secrets.JEI_LINE_USER_ID }}
        run: python -m scripts.diagnose_line_recipient --check-quota --result-path "${{ runner.temp }}/jei-line-recipient.json"
      - name: Store read-only LINE diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jei-line-recipient-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jei-line-recipient.json
          if-no-files-found: warn
          retention-days: 14
