name: JEI LINE Real Push Test
on:
  workflow_dispatch:
    inputs:
      expected_day:
        description: 'Explicit Taipei date YYYY-MM-DD; mismatched dates never send'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/jei-line-test.yml'
permissions:
  contents: read
jobs:
  send-test:
    # The guarded push trigger allows a one-time live delivery check without
    # needing a separate workflow-dispatch API; ordinary workflow edits skip it.
    if: "github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'test(line): verify live delivery 2026-11-14'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dated push, quota and duplicate protections
        run: |
          python -m unittest discover -s tests -p 'test_verify_line_push.py' -v
          python -m unittest discover -s tests -p 'test_daily_brief.py' -v
      - name: Send one actual LINE API test push
        env:
          JEI_LINE_ENABLED: ${{ vars.JEI_LINE_ENABLED }}
          JEI_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.JEI_LINE_CHANNEL_ACCESS_TOKEN }}
          JEI_LINE_USER_ID: ${{ secrets.JEI_LINE_USER_ID }}
          EXPECTED_DAY: ${{ inputs.expected_day || '2026-11-14' }}
        run: python -m scripts.verify_line_push --expected-day "$EXPECTED_DAY" --result-path "${{ runner.temp }}/jei-line-test.json"
      - name: Preserve credential-free API result (phone delivery unconfirmed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jei-line-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jei-line-test.json
          if-no-files-found: warn
          retention-days: 14
