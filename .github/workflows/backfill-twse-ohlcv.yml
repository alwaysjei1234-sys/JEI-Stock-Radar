name: Backfill TWSE Pattern Candles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-twse-ohlcv.yml'
      - 'scripts/backfill_twse_ohlcv.py'
  schedule:
    - cron: '10 9 * * 1-5' # 17:10 Taipei after official close
permissions:
  contents: write
concurrency:
  group: jei-twse-candles
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch bounded official TWSE candle months
        run: python -m scripts.backfill_twse_ohlcv --max-codes 8 --pause 4
      - name: Publish only original verified month files
        run: |
          git add data/twse_ohlcv/
          if git diff --cached --quiet; then
            echo "No new verified candle files"
            exit 0
          fi
          git config user.name "JEI Market Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Auto-backfill official TWSE OHLCV months"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          exit 1
