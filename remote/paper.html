<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEI 當沖模擬交易</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif;background:#06101b;color:#eaf6ff}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:850px;margin:auto}h1{font-size:24px}h2{font-size:18px}section{background:#0d2438;border:1px solid #24506e;border-radius:14px;padding:15px;margin:14px 0}label{display:block;margin:10px 0;font-size:13px;color:#a8c5d8}input,select,button{font:inherit;border:1px solid #345d77;background:#091c2d;color:#fff;border-radius:9px;padding:11px;width:100%}button{background:#1467a5;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric{padding:10px;background:#071927;border-radius:9px}.metric strong{display:block;font-size:20px;margin-top:5px}.mut{color:#9bb7cb;font-size:12px}.warn{color:#ffd166}.good{color:#41d8a1}.bad{color:#ff6070}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #29475d;text-align:left} .scroll{overflow-x:auto}a{color:#70d8ff}#notice{min-height:24px}
</style></head><body>
<a href="./index.html">← 返回 JEI 選股雷達</a>
<h1>🧪 JEI 當沖模擬交易</h1>
<p class="warn">純模擬，不連接券商、不送出真實委託。成交價由你手動輸入，不代表市場真實成交。資料只儲存在本裝置瀏覽器。</p>
<section><h2>模擬帳戶</h2><div class="metrics"><div class="metric">已實現淨損益<strong id="net">NT$0</strong></div><div class="metric">已完成交易<strong id="trades">0</strong></div><div class="metric">勝率<strong id="win">--</strong></div></div><p class="mut" id="summary"></p></section>
<section><h2>新增模擬成交</h2><div class="grid"><label>股票代號<input id="code" inputmode="numeric" maxlength="6" placeholder="2330"></label><label>交易日期<input id="day" type="date"></label><label>方向<select id="side"><option value="long">先買後賣</option><option value="short">先賣後買（須符合券商規則）</option></select></label><label>股數<input id="qty" type="number" min="1" step="1" value="1000"></label><label>進場成交價<input id="entry" type="number" min="0.01" step="0.01"></label><label>出場成交價<input id="exit" type="number" min="0.01" step="0.01"></label><label>手續費率（單邊）<input id="fee" type="number" min="0" max="0.1" step="0.000001" value="0.001425"></label><label>當沖交易稅率（賣出）<input id="tax" type="number" min="0" max="0.1" step="0.0001" value="0.0015"></label></div><p class="mut">預設費率僅供估算；未套用個人折扣、最低手續費及其他可能費用。請依實際券商與交易規則調整。</p><button id="save">記錄這筆已完成的模擬當沖</button><p id="notice" role="status"></p></section>
<section><h2>績效紀錄</h2><p class="mut">只統計已完成的模擬交易；不推算未成交委託、滑價或盤中未平倉風險。</p><div class="scroll"><table><thead><tr><th>日期</th><th>代號</th><th>方向</th><th>股數</th><th>進／出</th><th>淨損益</th><th>操作</th></tr></thead><tbody id="history"></tbody></table></div><p><button id="export">匯出 CSV 紀錄</button></p><p><button id="reset" style="background:#7d3340">清空本裝置模擬紀錄</button></p></section>
<script>
'use strict';
const KEY='jei-paper-trades-v1';
const $=id=>document.getElementById(id);
const twDay=()=>{const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day};
$('day').value=twDay();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return []}}
function calc(t){const buy=(t.side==='short'?t.exit:t.entry)*t.qty,sell=(t.side==='short'?t.entry:t.exit)*t.qty;const gross=sell-buy;const fees=(buy+sell)*t.fee;const tax=sell*t.tax;return {gross,fees,tax,net:gross-fees-tax}}
function money(n){return 'NT$'+Math.round(n).toLocaleString('zh-TW')}
function render(){const list=load(),p=list.map(calc),net=p.reduce((a,x)=>a+x.net,0),wins=p.filter(x=>x.net>0).length;$('net').textContent=money(net);$('net').className=net>=0?'good':'bad';$('trades').textContent=String(list.length);$('win').textContent=list.length?(100*wins/list.length).toFixed(1)+'%':'--';$('summary').textContent='總毛損益 '+money(p.reduce((a,x)=>a+x.gross,0))+'｜手續費 '+money(p.reduce((a,x)=>a+x.fees,0))+'｜交易稅 '+money(p.reduce((a,x)=>a+x.tax,0));const body=$('history');body.replaceChildren();list.slice().reverse().forEach((t,i)=>{const tr=document.createElement('tr');const values=[t.day,t.code,t.side==='short'?'先賣後買':'先買後賣',String(t.qty),t.entry+' / '+t.exit,money(calc(t).net)];values.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});const td=document.createElement('td'),btn=document.createElement('button');btn.textContent='刪除';btn.onclick=()=>{if(!confirm('確定刪除此筆模擬交易？'))return;const a=load();a.splice(a.length-1-i,1);localStorage.setItem(KEY,JSON.stringify(a));render()};td.appendChild(btn);tr.appendChild(td);body.appendChild(tr)})}
$('save').onclick=()=>{const t={day:$('day').value,code:$('code').value.trim(),side:$('side').value,qty:Number($('qty').value),entry:Number($('entry').value),exit:Number($('exit').value),fee:Number($('fee').value),tax:Number($('tax').value)};if(!/^\d{4,6}$/.test(t.code)||!/^\d{4}-\d{2}-\d{2}$/.test(t.day)||!Number.isInteger(t.qty)||t.qty<=0||![t.entry,t.exit].every(v=>Number.isFinite(v)&&v>0)||![t.fee,t.tax].every(v=>Number.isFinite(v)&&v>=0&&v<=0.1)){$('notice').textContent='請檢查代號、日期、股數、價格與費率';return}const list=load();list.push(t);try{localStorage.setItem(KEY,JSON.stringify(list));$('notice').textContent='模擬交易已儲存在本裝置';render()}catch(e){$('notice').textContent='儲存失敗：請確認瀏覽器儲存空間'}};
$('export').onclick=()=>{const rows=[['日期','代號','方向','股數','進場價','出場價','手續費率','交易稅率','毛損益','手續費','交易稅','淨損益'],...load().map(t=>{const p=calc(t);return [t.day,t.code,t.side,t.qty,t.entry,t.exit,t.fee,t.tax,p.gross,p.fees,p.tax,p.net]})];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='JEI-paper-trades.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('reset').onclick=()=>{if(confirm('確定清空全部模擬紀錄？此操作無法復原。')){localStorage.removeItem(KEY);render()}};
render();
</script></body></html>
