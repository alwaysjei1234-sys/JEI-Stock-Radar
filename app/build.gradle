plugins { id 'com.android.application' }

android {
    namespace 'com.jei.stockradar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jei.stockradar'
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName '3.7.0'
    }

    signingConfigs {
        jeiRelease {
            def ks = System.getenv('JEI_KEYSTORE')
            if (ks != null && !ks.isBlank()) {
                storeFile file(ks)
                storePassword System.getenv('JEI_STORE_PASSWORD')
                keyAlias System.getenv('JEI_KEY_ALIAS')
                keyPassword System.getenv('JEI_KEY_PASSWORD')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            signingConfig signingConfigs.jeiRelease
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}


dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
}
