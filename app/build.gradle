plugins { id 'com.android.application' }

android {
    namespace 'com.jei.stockradar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jei.stockradar'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '3.0.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
